# Bootstrap a fresh Machine from scratch in a container, then inspect it.
name: Bootstrap

on:
  pull_request:

permissions:
  contents: read

jobs:
  container:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report both containers, whichever fails first
      matrix:
        include:
          - name: Debian # Managed Machine
            distro: debian
          - name: Arch # Workstation
            distro: arch
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-bootstrap.sh ${{ matrix.distro }}
